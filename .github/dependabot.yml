# Rozenite ships its packages in lockstep and pins them to each other exactly
# (`rozenite@2.2.0` requires `@rozenite/agent-shared@2.2.0`, no caret), so they
# have to be bumped together. Ungrouped, most of the individual PRs would be
# unsatisfiable.
#
# React is grouped for a different reason: `react` and `react-dom` must resolve
# to the *exact* same version or the renderer throws "Incompatible React
# versions" at startup. A PR bumping one without the other cannot pass.
#
# Note that Dependabot does not touch `peerDependencies`
# (dependabot/dependabot-core#1242), and does not write `bun.lock` for these
# updates. `scripts/check-peer-ranges.mjs` covers the first; the `lockfile` job
# in ci.yml covers the second.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rozenite:
        patterns:
          - rozenite
          - '@rozenite/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rozenite:
        patterns:
          - rozenite
          - '@rozenite/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
