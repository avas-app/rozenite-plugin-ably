name: CI

# Gates every change, including the weekly Dependabot PRs that bump the Rozenite
# and React groups. Discovery of new releases is Dependabot's job (see
# .github/dependabot.yml) — this is what decides whether one is safe to merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lockfile:
    # Dependabot updates package.json but does not write bun.lock, so its PRs
    # arrive with the two out of sync and fail the frozen install below — and
    # merging one would leave main's lockfile stale too. This commits the
    # missing update back onto the PR branch, which starts a fresh run.
    name: Dependabot lockfile
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - name: Resolve the example lockfile too
        run: bun install
        working-directory: example

      - id: commit
        name: Commit the lockfiles if they moved
        run: |
          if git diff --quiet -- bun.lock example/bun.lock; then
            echo "lockfiles already in sync"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock example/bun.lock
          git commit -m 'Resolve the bun lockfiles for this bump'
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: lockfile
    # `lockfile` is skipped for everything that is not Dependabot, and a skipped
    # dependency would otherwise skip this job too. When it did push, the run it
    # started supersedes this one.
    if: |
      always()
      && needs.lockfile.result != 'failure'
      && needs.lockfile.outputs.pushed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # First, and before installing anything: Dependabot updates
      # devDependencies but not peerDependencies, so a Rozenite major arrives
      # with half the manifest bumped. Everything below this would pass anyway.
      - name: Peer ranges
        run: node scripts/check-peer-ranges.mjs

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test src/

      - name: Build
        run: bun run build

      # Resolves the packed tarball from a real consumer install. The example
      # app cannot catch a duplicate bridge — its metro.config puts the plugin's
      # own node_modules on the resolver path.
      - name: Peer resolution
        run: |
          node scripts/check-peer-resolution.mjs \
            "$(node -p "require('./node_modules/rozenite/package.json').version")"
